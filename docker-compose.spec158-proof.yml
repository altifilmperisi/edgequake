# Isolated SPEC-158 live proof (EC-158-22/25). Does not bind 8080/8081/9000.
#
#   docker compose -f docker-compose.spec158-proof.yml up -d
#   # or: make spec158-proof-up
#
# Host API (working tree) is the BFF. Keycloak posts back-channel logout to
# host.docker.internal:18080 — never to localhost inside the container.
name: eq158-proof

services:
  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloak_dev_only}
    volumes:
      - eq158-proof-kc-pg:/var/lib/postgresql/data
    networks:
      - eq158-proof
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: ${EDGEQUAKE_KEYCLOAK_IMAGE:-edgequake-keycloak:spec158}
    restart: unless-stopped
    command: ["start", "--optimized", "--import-realm"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak_dev_only}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8081"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME: ${KC_PUBLIC_URL:-http://localhost:18081}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin_dev_only}
      EQ_KC_CLIENT_SECRET: ${EQ_KC_CLIENT_SECRET:-edgequake_dev_only_secret_change_me}
      EQ_KC_SSL_REQUIRED: ${EQ_KC_SSL_REQUIRED:-none}
      EQ_KC_DEMO_PASSWORD: ${EQ_KC_DEMO_PASSWORD:-demo-password-change-me}
      EQ_API_PUBLIC_URL: ${EQ_API_PUBLIC_URL:-http://localhost:18080}
      EQ_API_INTERNAL_URL: ${EQ_API_INTERNAL_URL:-http://host.docker.internal:18080}
    ports:
      - "${KC_PORT:-18081}:8081"
      - "${KC_MGMT_PORT:-19000}:9000"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - eq158-proof
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

volumes:
  eq158-proof-kc-pg:

networks:
  eq158-proof:
    name: eq158-proof
