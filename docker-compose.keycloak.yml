# EdgeQuake + Keycloak SSO overlay (SPEC-158 W4)
#
#   docker compose -f docker-compose.quickstart.yml -f docker-compose.keycloak.yml up -d
#   # or: make dev-sso
#
# One-time host setup (browser must resolve the same issuer host the API uses):
#   echo "127.0.0.1 keycloak" | sudo tee -a /etc/hosts
#
# Keycloak:   http://keycloak:8081  (admin: admin / $KC_ADMIN_PASSWORD)
# Demo users: alice (acme, admin) · bob (globex) · carol (acme+globex)  — password $EQ_KC_DEMO_PASSWORD
#
# LOCAL DEMO DEFAULTS ONLY. In production set real secrets, use `start --optimized` behind HTTPS,
# a dedicated Keycloak database, and pin the image digest (docs/security/authentication/keycloak.md).
services:
  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloak_dev_only}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - edgequake
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: ${EDGEQUAKE_KEYCLOAK_IMAGE:-ghcr.io/raphaelmansuy/edgequake-keycloak:${EDGEQUAKE_VERSION:-latest}}
    build:
      context: ./deploy/keycloak
      dockerfile: Containerfile
    restart: unless-stopped
    # Dev mode: HTTP + relaxed hostname. Production: `start --optimized --import-realm`.
    command: ["start-dev", "--import-realm"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak_dev_only}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8081"
      KC_HOSTNAME: ${KC_PUBLIC_URL:-http://keycloak:8081}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin_dev_only}
      # Realm-import placeholders (deploy/keycloak/realm/edgequake-realm.json)
      EQ_KC_CLIENT_SECRET: ${EQ_KC_CLIENT_SECRET:-edgequake_dev_only_secret_change_me}
      # Dev overlay is plain http on a docker network (non-local client IPs); production keeps `external`.
      EQ_KC_SSL_REQUIRED: ${EQ_KC_SSL_REQUIRED:-none}
      EQ_KC_DEMO_PASSWORD: ${EQ_KC_DEMO_PASSWORD:-demo-password-change-me}
      EQ_API_PUBLIC_URL: ${EQ_API_PUBLIC_URL:-http://localhost:8080}
      EQ_API_INTERNAL_URL: http://api:8080
    ports:
      - "${KC_PORT:-8081}:8081"
      - "${KC_MGMT_PORT:-9000}:9000"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - edgequake
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  api:
    environment:
      EDGEQUAKE_AUTH_ENABLED: "true"
      EDGEQUAKE_STRICT_TENANT_BIND: "true"
      # Break-glass local admin (also lets keycloak-smoke seed the acme/globex tenants).
      EDGEQUAKE_BOOTSTRAP_ADMIN_PASSWORD: ${EDGEQUAKE_BOOTSTRAP_ADMIN_PASSWORD:-Admin-dev-only-change-me-1}
      EDGEQUAKE_OIDC_ENABLED: "true"
      EDGEQUAKE_OIDC_KIND: keycloak
      EDGEQUAKE_OIDC_SLUG: keycloak
      EDGEQUAKE_OIDC_DISPLAY_NAME: ${EDGEQUAKE_OIDC_DISPLAY_NAME:-Sign in with Keycloak}
      # Browser and API resolve the SAME host (`keycloak`): compose DNS for the API, /etc/hosts
      # for the browser — the issuer string must match byte-for-byte.
      EDGEQUAKE_OIDC_ISSUER_URL: ${KC_PUBLIC_URL:-http://keycloak:8081}/realms/edgequake
      EDGEQUAKE_OIDC_CLIENT_ID: edgequake-web
      EDGEQUAKE_OIDC_CLIENT_SECRET: ${EQ_KC_CLIENT_SECRET:-edgequake_dev_only_secret_change_me}
      EDGEQUAKE_OIDC_REDIRECT_URI: ${EQ_API_PUBLIC_URL:-http://localhost:8080}/api/v1/auth/oidc/callback
      EDGEQUAKE_OIDC_SUCCESS_REDIRECT_URL: ${EQ_WEB_PUBLIC_URL:-http://localhost:3000}/auth/callback
      EDGEQUAKE_OIDC_ROLE_MAP: '{"eq-admin":"admin","eq-user":"member"}'
    depends_on:
      keycloak:
        condition: service_healthy

volumes:
  keycloak-db-data:
